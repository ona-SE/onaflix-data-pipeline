services:
  postgres:
    name: PostgreSQL
    description: PostgreSQL database for the OnaFlix pipeline
    triggeredBy:
      - postDevcontainerStart
    commands:
      start: |
        if ! command -v pg_isready &> /dev/null; then
          sudo apt-get update && sudo apt-get install -y postgresql
        fi
        sudo pg_ctlcluster $(pg_lsclusters -h | head -1 | awk '{print $1, $2}') start || true
        sudo -u postgres psql -c "ALTER USER postgres PASSWORD 'gitpod';" || true
        sudo -u postgres psql -c "CREATE USER gitpod WITH PASSWORD 'gitpod' SUPERUSER;" 2>/dev/null || true
        sudo -u postgres psql -c "CREATE DATABASE onaflix OWNER gitpod;" 2>/dev/null || true
        sudo -u postgres psql -d onaflix -c "
          CREATE TABLE IF NOT EXISTS movies (
            id SERIAL PRIMARY KEY,
            title TEXT NOT NULL,
            description TEXT,
            release_year INTEGER,
            rating NUMERIC(3,1),
            image_url TEXT,
            director TEXT,
            created_at TIMESTAMPTZ DEFAULT NOW(),
            updated_at TIMESTAMPTZ DEFAULT NOW()
          );
        "
        echo "PostgreSQL ready on port 5432"
        # Keep the service running
        tail -f /var/log/postgresql/*.log 2>/dev/null || sleep infinity
      stop: |
        sudo pg_ctlcluster $(pg_lsclusters -h | head -1 | awk '{print $1, $2}') stop || true

tasks:
  go-deps:
    name: Install Go Dependencies
    description: Download Go modules
    triggeredBy:
      - postDevcontainerStart
    commands:
      start: go mod download

  build:
    name: Build Pipeline
    description: Compile the pipeline binary
    triggeredBy:
      - postDevcontainerStart
    dependsOn:
      - go-deps
    commands:
      start: go build -o bin/pipeline cmd/pipeline/main.go

  test:
    name: Run Tests
    description: Execute the test suite
    triggeredBy:
      - postDevcontainerStart
    dependsOn:
      - go-deps
    commands:
      start: go test ./...
