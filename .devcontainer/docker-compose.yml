services:
  app:
    image: mcr.microsoft.com/devcontainers/go:1.21
    volumes:
      - ..:/workspaces/onaflix-data-pipeline:cached
    command: sleep infinity
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gitpod:gitpod@postgres:5432/onaflix?sslmode=disable

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: gitpod
      POSTGRES_PASSWORD: gitpod
      POSTGRES_DB: onaflix
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitpod -d onaflix"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
